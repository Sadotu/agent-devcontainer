name: Publish devcontainer image

on:
  push:
    branches: [main]
    paths:
      - .devcontainer/**
      - .github/workflows/publish-image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ghcr.io image paths must be lowercase; github.repository_owner isn't
      # guaranteed to be.
      - name: Compute lowercase owner
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute build date
        id: build
        run: |
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "date=$build_date" >> "$GITHUB_OUTPUT"
          echo "dependency_epoch=${build_date%%T*}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          push: true
          pull: true
          # Keep intermediate vendor stages too; v2 uses Actions runtime auth.
          cache-from: type=gha,scope=agent-devcontainer,version=2
          cache-to: type=gha,scope=agent-devcontainer,version=2,mode=max
          # Bake the version identifier into the image (issue #24). github.sha
          # changes every published build and matches the :<sha> tag below.
          # Refresh floating dependencies on the first publish each UTC day.
          build-args: |
            DEPENDENCY_CACHE_EPOCH=${{ steps.build.outputs.dependency_epoch }}
            IMAGE_VERSION=${{ github.sha }}
            IMAGE_BUILD_DATE=${{ steps.build.outputs.date }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/agent-devcontainer:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/agent-devcontainer:${{ github.sha }}
